name: Release APK

# Manual only. A push trigger here would re-fire on the tag this workflow pushes,
# which is an infinite loop.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Serialize rather than cancel: the next version is derived from the newest tag, so two
# concurrent runs would both read the same one and try to release the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0   # shallow clones hide tags, and the version comes from them

      - name: Check signing secrets are present
        # Through env, not ${{ }}: interpolation splices the secret's *value* into the
        # shell source, so a password containing $ or a backtick would be expanded before
        # the test ran and report itself missing when it is set.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "Run ./scripts/setup-signing.sh to generate a keystore and upload them." >&2
            exit 1
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compute next version
        id: version
        run: |
          # --sort=-version:refname, because a lexical sort puts v0.9.0 above v0.10.0.
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -1)
          [ -z "$LATEST" ] && LATEST="v0.0.0"
          VERSION="${LATEST#v}"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Cannot parse tag: $LATEST"; exit 1; }
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Decode and verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          # Gradle decides at *configuration* time whether a signing config exists, so a
          # corrupt keystore is not an error there — it silently produces
          # app-release-unsigned.apk and the staging step below then dies with
          # "cp: cannot stat app-release.apk", minutes later and nowhere near the cause.
          # This covers the file, the store password and the alias. It deliberately does
          # not pass -keypass: setup-signing.sh writes a PKCS12 keystore, which has no
          # separate key password, and keytool ignores the flag with a warning. The
          # apksigner step below is what actually proves the signature.
          keytool -list -keystore release.keystore -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage the APK under a stable filename
        run: |
          # A fixed name is what makes releases/latest/download/Weather.apk work.
          cp app/build/outputs/apk/release/app-release.apk Weather.apk
          ls -la Weather.apk

      - name: Verify the APK is signed
        run: |
          # The check that proves what we are about to publish. An unsigned APK uploads
          # exactly as cleanly as a signed one, and the site tells visitors every release
          # is signed — so assert it rather than infer it from a green build. This also
          # covers the one fault the keystore pre-flight cannot see, a key password that
          # does not match the store password.
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found in the Android SDK" >&2; exit 1; }
          "$APKSIGNER" verify --print-certs Weather.apk

      - name: Remove keystore from the runner
        if: always()
        run: rm -f release.keystore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Weather-${{ steps.version.outputs.tag }}
          path: Weather.apk

      # This step creates the tag as well as the release. Pushing the tag ourselves first
      # would mean a failure here left the tag behind with no release attached, and the
      # next run would compute the following version — burning that number for good.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Without this the tag lands on whatever the default branch points at when the
          # API call runs, which is not necessarily the commit whose APK is attached.
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: Weather.apk
