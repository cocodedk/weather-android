name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

# PR CI is the one place cancel-in-progress belongs: a superseded run has nothing
# to tell us. Deploy and release workflows must never cancel mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build, test and lint
        run: ./gradlew buildSmoke --no-daemon

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/
          retention-days: 7
